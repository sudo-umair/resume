name: Build résumé

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TECTONIC_VERSION: 0.17.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to date the last content change

      # Reproducible PDFs: stamp the build with the time of the last commit
      # that changed the résumé itself, so identical content gives an
      # identical file and the portfolio sync only commits real changes.
      - name: Pin the build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- src Tectonic.toml)" >> "$GITHUB_ENV"

      # Same pinned version as local builds, from the official GitHub release.
      - name: Install Tectonic
        run: |
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin tectonic
          tectonic --version

      - name: Cache LaTeX packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ env.TECTONIC_VERSION }}-${{ hashFiles('Tectonic.toml', 'src/_preamble.tex') }}
          restore-keys: tectonic-${{ env.TECTONIC_VERSION }}-

      - name: Build PDF
        run: tectonic -X build --keep-logs

      - name: Check it is one page
        run: |
          pages=$(grep -o '([0-9]* page' build/muhammad-umair-resume/muhammad-umair-resume.log | grep -o '[0-9]*')
          echo "Pages: $pages"
          test "$pages" = "1" || { echo "::error::The résumé is $pages pages; it must fit on one."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: muhammad-umair-resume
          path: build/muhammad-umair-resume/muhammad-umair-resume.pdf

  # Publish the PDF to one rolling release with a stable download URL:
  # https://github.com/sudo-umair/resume/releases/download/resume/muhammad-umair-resume.pdf
  # The portfolio's sync workflow picks it up from there.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: resume
      # Job-level so the step's `if` can see it (a step's own env isn't visible to its `if`).
      PORTFOLIO_SYNC_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muhammad-umair-resume

      - name: Update the rolling release
        run: |
          notes="Built from ${GITHUB_SHA::7} by run #${GITHUB_RUN_NUMBER}."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Latest résumé" --notes "$notes" --latest
          fi
          gh release upload "$TAG" muhammad-umair-resume.pdf --repo "$GITHUB_REPOSITORY" --clobber

      # Start the portfolio's sync right away instead of waiting for its
      # schedule. Needs PORTFOLIO_SYNC_TOKEN: a fine-grained token limited to
      # sudo-umair/portfolio with "Actions: read and write". Skipped if unset.
      - name: Trigger the portfolio sync
        if: env.PORTFOLIO_SYNC_TOKEN != ''
        run: GH_TOKEN="$PORTFOLIO_SYNC_TOKEN" gh workflow run sync-resume.yml --repo sudo-umair/portfolio --ref main
